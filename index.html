<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's Your AI Superpower?</title>
<meta name="description" content="A 60-second 3D game: answer 5 questions and unlock your AI hero.">
<meta property="og:title" content="What's Your AI Superpower?">
<meta property="og:description" content="5 levels. 6 AI heroes. Which one are you?">
<meta name="theme-color" content="#05060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060d;
    --panel: rgba(14, 16, 32, .78);
    --stroke: rgba(255, 255, 255, .12);
    --stroke-2: rgba(255, 255, 255, .22);
    --text: #f2f4ff;
    --muted: #98a2c8;
    --accent: #7c6cff;
    --accent-2: #33d6ff;
    --display: "Space Grotesk", Inter, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  body.no3d {
    background:
      radial-gradient(900px 520px at 50% 34%, #241a5588, transparent 70%),
      radial-gradient(700px 500px at 100% 100%, #0e3b4a55, transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  button { font-family: inherit; color: inherit; }

  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; opacity: 0; transition: opacity 1.2s ease; }
  .has3d #gl { opacity: 1; }
  .no3d #gl { display: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(130% 85% at 50% 42%, transparent 55%, rgba(0,0,0,.6)); }

  .app {
    position: relative; z-index: 2; max-width: 480px; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; animation: enter .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Shared ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 42px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
    font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #cfd5f5;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #33ffc4; box-shadow: 0 0 10px #33ffc4; animation: pulse 1.4s ease-in-out infinite; flex: none; }
  .icon-btn {
    appearance: none; width: 42px; height: 42px; border-radius: 12px; flex: none; cursor: pointer;
    display: grid; place-items: center; background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .1s ease;
  }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn[disabled] { opacity: .3; pointer-events: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .kicker { font: 500 11px/1.5 var(--mono); letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }

  .btn {
    position: relative; overflow: hidden; appearance: none; border: 0; cursor: pointer; width: 100%; height: 58px;
    border-radius: 16px; font: 600 15px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: #fff;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary {
    background: linear-gradient(135deg, #7c6cff 0%, #4b8bff 55%, #33d6ff 100%);
    box-shadow: 0 14px 40px -12px rgba(110,120,255,.9), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn.primary::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
    animation: sheen 3.2s ease-in-out infinite;
  }
  @keyframes sheen { 60%, 100% { transform: translateX(100%); } }
  .btn.ghost { background: rgba(255,255,255,.06); border: 1px solid var(--stroke-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border: 1px solid var(--stroke); border-radius: 20px;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .zone { position: relative; }
  .drag { touch-action: pan-y; cursor: grab; }
  .drag:active { cursor: grabbing; }

  /* Loading spinner shown until the 3D scene is ready */
  .loader { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .loader::before { content: ""; width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--accent-2); animation: spin .9s linear infinite; }
  .has3d .loader, .no3d .loader { display: none; }

  /* Fallback visuals for phones that can't run 3D */
  .fb { display: none !important; }
  .no3d .fb { display: grid !important; }
  .orb {
    display: inline-grid; place-items: center; width: 64px; aspect-ratio: 1; border-radius: 50%;
    font: 700 22px/1 var(--display); color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.4);
    background: radial-gradient(circle at 34% 30%, #fff 0 5%, color-mix(in srgb, var(--c) 70%, #fff) 12%, var(--c) 42%, color-mix(in srgb, var(--c) 35%, #000) 80%);
    box-shadow: 0 0 34px -4px var(--c);
  }

  /* ---------- Intro ---------- */
  .intro { gap: 10px; }
  .intro-head { text-align: center; margin-top: 12px; }
  .title { margin: 10px 0 0; font: 700 clamp(40px, 12vw, 58px)/.98 var(--display); letter-spacing: -.035em; }
  .title .pre { display: block; font-size: .42em; font-weight: 500; letter-spacing: -.01em; color: #c9cff0; margin-bottom: 8px; }
  .title .grad {
    background: linear-gradient(100deg, #ffffff 0%, #c7c0ff 35%, #7c6cff 62%, #33d6ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(124,108,255,.45));
  }
  .intro .zone { flex: 1; min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
  .fb-grid { grid-template-columns: repeat(3, 1fr); gap: 16px 8px; place-items: center; align-content: center; height: 100%; }
  .fb-grid div { display: flex; flex-direction: column; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); color: var(--muted); }
  .front-label { text-align: center; min-height: 54px; }
  .front-label.swap { animation: enter .45s ease; }
  .fl-name { display: block; font: 700 23px/1.15 var(--display); letter-spacing: -.01em; }
  .fl-power { display: block; margin-top: 4px; font: 500 11px/1.4 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .no3d .front-label { display: none; }
  .micro { text-align: center; font: 500 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: #6f789e; margin: 8px 0 0; }
  .no3d .micro { visibility: hidden; }

  /* ---------- Quiz ---------- */
  .hud { display: flex; align-items: center; gap: 10px; }
  .hud-mid { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .hud-level { font: 700 11px/1 var(--mono); letter-spacing: .18em; color: #cfd5f5; }
  .segments { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .segments i { height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); transition: background .3s, box-shadow .3s; }
  .segments i.done { background: linear-gradient(90deg, #7c6cff, #33d6ff); box-shadow: 0 0 10px rgba(80,170,255,.7); }
  .segments i.now { background: rgba(255,255,255,.5); animation: pulse 1.2s infinite; }
  .xp { font: 700 13px/1 var(--mono); color: var(--accent-2); letter-spacing: .06em; min-width: 62px; text-align: right; text-shadow: 0 0 12px rgba(51,214,255,.6); }
  .xp.bump { animation: xpbump .45s ease; }
  @keyframes xpbump { 40% { transform: scale(1.3); } }
  .race-zone { height: clamp(150px, 27vh, 250px); margin: 6px 0 4px; }
  .zone-label { position: absolute; left: 0; top: 6px; display: flex; align-items: center; gap: 8px; font: 500 10px/1 var(--mono); letter-spacing: .2em; color: var(--muted); }
  .fb-race { grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; height: 100%; padding-top: 26px; }
  .fb-race div { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .fb-race .orb { width: 36px; font-size: 13px; }
  .fb-race .meter { width: 8px; flex: 1; max-height: 80px; border-radius: 4px; background: rgba(255,255,255,.08); display: flex; align-items: flex-end; overflow: hidden; }
  .fb-race .meter i { width: 100%; height: 0; background: var(--c); box-shadow: 0 0 10px var(--c); transition: height .5s ease; }
  .qcard { padding: 16px 16px 18px; margin-bottom: 12px; }
  .qmeta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .qlevel { font: 700 11px/1 var(--mono); letter-spacing: .18em; color: var(--accent-2); }
  .qtitle { font: 500 11px/1 var(--mono); letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  .question { margin: 0; font: 600 clamp(21px, 6vw, 25px)/1.22 var(--display); letter-spacing: -.01em; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    appearance: none; cursor: pointer; width: 100%; text-align: left; display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--stroke);
    font: 500 15.5px/1.35 Inter, system-ui, sans-serif;
    transition: border-color .2s, background .2s, transform .1s, box-shadow .2s, opacity .2s;
    animation: optin .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .opt:nth-child(2) { animation-delay: .06s; } .opt:nth-child(3) { animation-delay: .12s; } .opt:nth-child(4) { animation-delay: .18s; }
  @keyframes optin { from { opacity: 0; transform: translateY(10px); } }
  .opt .k {
    flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font: 700 13px/1 var(--mono); color: #cfd5f5; border: 1px solid var(--stroke-2); background: rgba(255,255,255,.04);
  }
  .opt:active { transform: scale(.985); }
  @media (hover: hover) { .opt:hover { border-color: rgba(124,108,255,.6); } }
  .opt.selected {
    border-color: #7c6cff; background: linear-gradient(90deg, rgba(124,108,255,.34), rgba(51,214,255,.14));
    box-shadow: 0 0 0 1px rgba(124,108,255,.5), 0 10px 30px -10px rgba(124,108,255,.8);
  }
  .opt.selected .k { background: linear-gradient(135deg, #7c6cff, #33d6ff); color: #fff; border-color: transparent; }
  .options.locked .opt:not(.selected) { opacity: .4; }
  .float-xp {
    position: fixed; z-index: 30; pointer-events: none; font: 700 18px/1 var(--mono); color: var(--accent-2);
    text-shadow: 0 0 14px rgba(51,214,255,.9); animation: floatup .9s ease-out forwards;
  }
  @keyframes floatup { to { transform: translateY(-64px); opacity: 0; } }

  /* ---------- Reveal ---------- */
  .reveal { text-align: center; }
  .reveal-top { margin-top: 22px; }
  .reveal h2 { margin: 10px 0 0; font: 600 26px/1.15 var(--display); letter-spacing: -.01em; }
  .cursor { display: inline-block; width: .45em; height: .95em; margin-left: 4px; vertical-align: -.1em; background: var(--accent-2); animation: pulse .8s steps(2) infinite; }
  .reveal .zone { flex: 1; min-height: 320px; }
  .fb-slot { place-items: center; height: 100%; }
  .fb-slot .orb { width: 150px; font-size: 48px; transition: background .1s; }
  .reveal-name { font: 700 30px/1.1 var(--display); letter-spacing: -.02em; min-height: 1.2em; margin-bottom: 34px; text-shadow: 0 0 30px currentColor; }
  .flash { position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 45%, #fff, rgba(255,255,255,.35) 40%, transparent 70%); }
  .flash.go { animation: flash .7s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  /* ---------- Result ---------- */
  .result { gap: 14px; }
  .hero-zone { height: clamp(300px, 50vh, 460px); margin: 0 -16px; }
  .badge { position: absolute; top: 8px; padding: 7px 11px; border-radius: 10px; font: 700 11px/1.2 var(--mono); letter-spacing: .14em; color: #fff; }
  .xp-badge { left: 16px; background: rgba(255,255,255,.08); border: 1px solid var(--stroke); color: var(--accent-2); }
  .rarity { right: 16px; text-align: right; }
  .rarity small { display: block; font-size: 10px; font-weight: 500; letter-spacing: .06em; opacity: .9; }
  .rarity.Legendary { background: linear-gradient(120deg, #ffb020, #ff4f9a, #8b5cff, #ffb020); background-size: 300% 100%; animation: holo 3s linear infinite; box-shadow: 0 0 22px rgba(255,120,80,.6); }
  .rarity.Epic { background: linear-gradient(120deg, #8b5cff, #ff5fae); box-shadow: 0 0 18px rgba(170,90,255,.5); }
  .rarity.Rare { background: linear-gradient(120deg, #2b8cff, #2ee6d0); }
  @keyframes holo { to { background-position: 300% 0; } }
  .drag-hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap;
    padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--stroke);
    font: 500 10px/1 var(--mono); letter-spacing: .18em; color: var(--muted); transition: opacity .4s;
  }
  .drag-hint.hide, .no3d .drag-hint { opacity: 0; }
  .fb-hero { place-items: center; height: 100%; }
  .fb-hero .orb { width: 190px; font-size: 64px; }
  .name-block { text-align: center; margin-top: -6px; }
  .you-are { font: 500 11px/1 var(--mono); letter-spacing: .24em; color: var(--muted); }
  .pname { margin: 8px 0 10px; font: 700 clamp(34px, 10vw, 44px)/1 var(--display); letter-spacing: -.03em; color: var(--c); text-shadow: 0 0 34px color-mix(in srgb, var(--c) 60%, transparent); }
  .streak { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--stroke); font-size: 14px; color: var(--muted); }
  .streak b { color: var(--text); font-weight: 600; }
  .streak .thumb { width: 30px; height: 30px; }
  .card { padding: 4px 18px 18px; }
  .sec { padding: 15px 0 3px; border-top: 1px solid var(--stroke); }
  .sec:first-child { border-top: 0; }
  .sec h3 { margin: 0 0 8px; font: 700 10.5px/1.5 var(--mono); letter-spacing: .22em; color: var(--c); }
  .sec .big { font: 700 22px/1.2 var(--display); margin-bottom: 4px; }
  .sec p { margin: 0; color: #d7dcf5; line-height: 1.5; font-size: 15.5px; }
  .stats { display: grid; gap: 9px; }
  .stat { display: grid; grid-template-columns: 74px 1fr 22px; align-items: center; gap: 10px; font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #cfd5f5; }
  .stat .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .stat .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--sc); box-shadow: 0 0 10px var(--sc); transition: width 1s cubic-bezier(.2,.9,.3,1); }
  .stat .v { text-align: right; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid var(--stroke); font-size: 14px; font-weight: 500; }
  .card-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; font: 500 10px/1 var(--mono); letter-spacing: .14em; color: #6f789e; text-transform: uppercase; }
  .collection { padding: 14px; }
  .collection h4 { display: flex; justify-content: space-between; margin: 0 0 10px; font: 700 10.5px/1 var(--mono); letter-spacing: .2em; color: #cfd5f5; }
  .collection h4 span { color: var(--accent-2); }
  .coll-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .coll-row .slot { aspect-ratio: 1; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--stroke); display: grid; place-items: center; overflow: hidden; }
  .coll-row .slot.got { border-color: color-mix(in srgb, var(--c) 60%, transparent); box-shadow: inset 0 0 18px -6px var(--c); }
  .collection p { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
  .thumb { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb.locked { filter: brightness(0) drop-shadow(0 0 4px var(--c)); opacity: .9; }
  span.thumb.orb { width: 80%; height: auto; font-size: 12px; }
  .streak span.thumb.orb { width: 30px; font-size: 11px; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600;
    opacity: 0; transition: all .25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="flash" id="flash"></div>

<main class="app">
  <!-- TITLE -->
  <section class="screen intro active" id="intro">
    <div class="topbar">
      <div class="chip"><span class="dot"></span><span id="eventName"></span></div>
      <button class="icon-btn" data-sound aria-label="Toggle sound"></button>
    </div>
    <header class="intro-head">
      <div class="kicker">5 levels · 6 AI heroes · 60 seconds</div>
      <h1 class="title"><span class="pre">What's your</span><span class="grad">AI superpower?</span></h1>
    </header>
    <div class="zone drag" data-zone>
      <div class="loader"></div>
      <div class="fb fb-grid" id="fbGrid"></div>
    </div>
    <div class="front-label" id="frontLabel"><span class="fl-name"></span><span class="fl-power"></span></div>
    <button class="btn primary" id="startBtn">Start game</button>
    <p class="micro">Swipe to browse the heroes</p>
  </section>

  <!-- LEVELS -->
  <section class="screen" id="quiz">
    <div class="hud">
      <button class="icon-btn" id="backBtn" aria-label="Previous level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="hud-mid"><div class="hud-level" id="hudLevel"></div><div class="segments" id="pips"></div></div>
      <div class="xp" id="xp">0 XP</div>
      <button class="icon-btn" data-sound aria-label="Toggle sound"></button>
    </div>
    <div class="zone race-zone" data-zone>
      <div class="zone-label"><span class="dot"></span>WHO'S WINNING YOU?</div>
      <div class="fb fb-race" id="fbRace"></div>
    </div>
    <div class="qcard glass">
      <div class="qmeta"><span class="qlevel" id="qLevel"></span><span class="qtitle" id="qTitle"></span></div>
      <h2 class="question" id="qText"></h2>
    </div>
    <div class="options" id="opts"></div>
  </section>

  <!-- REVEAL -->
  <section class="screen reveal" id="reveal">
    <div class="reveal-top">
      <div class="kicker" id="revealKicker"></div>
      <h2 id="revealTitle"></h2>
    </div>
    <div class="zone" data-zone><div class="fb fb-slot"><span class="orb" id="fbSlot"></span></div></div>
    <div class="reveal-name" id="slotName"></div>
  </section>

  <!-- RESULT -->
  <section class="screen result" id="result">
    <div class="zone hero-zone drag" data-zone>
      <div class="badge xp-badge" id="xpBadge"></div>
      <div class="badge rarity" id="rarityBadge"></div>
      <div class="drag-hint" id="dragHint">⟲ DRAG TO ROTATE</div>
      <div class="fb fb-hero"><span class="orb" id="fbHero"></span></div>
    </div>
    <div class="name-block" id="nameBlock"></div>
    <div class="card glass" id="card"></div>
    <div class="collection glass" id="collection"></div>
    <p class="hint">Screenshot your hero and share it</p>
    <div class="btn-row">
      <button class="btn ghost" id="retryBtn">Play again</button>
      <button class="btn primary" id="shareBtn">Share</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</main>

<script>
/* ===== Settings: change these before the event ===== */
const EVENT_NAME = "AI Talk · AUB";
const SPIN_MS = 3800;

/* ===== Personas =====
   Each answer adds 2 points to one persona and 1 point to another.

const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
const Sound = {
  on: store.get("aisp_sound", true),
  ctx: null,
  noise: null,
  init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const len = this.ctx.sampleRate;
        this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur, o = {}) {
    if (!this.on || !this.ctx) return;
    const { type = "sine", vol = 0.05, when = 0, to = null, attack = 0.005 } = o;
    const t = this.ctx.currentTime + when;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  whoosh(dur, from, to, vol = 0.05, when = 0) {
    if (!this.on || !this.ctx || !this.noise) return;
    const t = this.ctx.currentTime + when;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise; src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 0.9;
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(this.ctx.destination);
    src.start(t); src.stop(t + dur + 0.05);
  },
  start() {
    this.whoosh(0.8, 200, 4000, 0.07);
    [220, 330, 495].forEach((f, i) => this.tone(f, 0.9, { type: "triangle", vol: 0.04, when: 0.05 + i * 0.07, attack: 0.03 }));
  },
  pick() {
    this.tone(880, 0.12, { vol: 0.06, to: 1320 });
    this.tone(1760, 0.18, { vol: 0.025, when: 0.05 });
    this.whoosh(0.22, 1500, 6000, 0.02);
  },
  back() { this.tone(660, 0.12, { vol: 0.05, to: 330 }); },
  tick() { this.tone(2200, 0.03, { type: "square", vol: 0.012 }); },
  win() {
    this.tone(90, 1.2, { vol: 0.3, to: 38, attack: 0.01 });
    this.whoosh(1.4, 6000, 300, 0.06);
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 1.8, { type: "triangle", vol: 0.045, when: 0.08 + i * 0.07, attack: 0.04 }));
    this.tone(2093, 0.6, { vol: 0.02, when: 0.45 });
  }
};

/* ===== Scoring ===== */
function tally(ans) {
  const totals = {}, primaries = {}, lastSeen = {};
  KEYS.forEach((k) => { totals[k] = 0; primaries[k] = 0; lastSeen[k] = -1; });
  ans.forEach((ai, qi) => {
    if (ai === null) return;
    const s = QUESTIONS[qi].a[ai].s;
    for (const k in s) { totals[k] += s[k]; if (s[k] === 2) primaries[k]++; lastSeen[k] = qi; }
  });
  return { totals, primaries, lastSeen };
}
/* Highest score wins. On a tie, the persona with more 2-point picks wins;
   if still tied, the one picked most recently wins. */
function rank(ans) {
  const { totals, primaries, lastSeen } = tally(ans);
  const ranked = [...KEYS].sort((a, b) => totals[b] - totals[a] || primaries[b] - primaries[a] || lastSeen[b] - lastSeen[a]);
  return { primary: ranked[0], secondary: ranked[1], totals };
}

/* Rarity: how many of the 1,024 possible answer paths lead to each hero + sidekick pair. */
const PATH_COUNT = {};
(function () {
  const total = 4 ** QUESTIONS.length, ans = new Array(QUESTIONS.length);
  for (let i = 0; i < total; i++) {
    for (let q = 0; q < QUESTIONS.length; q++) ans[q] = Math.floor(i / 4 ** q) % 4;
    const r = rank(ans), key = r.primary + "+" + r.secondary;
    PATH_COUNT[key] = (PATH_COUNT[key] || 0) + 1;
  }
  PATH_COUNT.total = total;
})();
function rarity(primary, secondary) {
  const n = Math.round(PATH_COUNT.total / PATH_COUNT[primary + "+" + secondary]);
  const tier = n >= 60 ? "Legendary" : n >= 35 ? "Epic" : "Rare";
  return { tier, n };
}

function choose(i, btn, e) {
  if (busy) return;
  busy = true;
  Sound.init(); Sound.pick(); vibrate(12);
  const wasNew = answers[current] === null;
  answers[current] = i;
  $("opts").classList.add("locked");
  document.querySelectorAll(".opt").forEach((o) => o.classList.remove("selected"));
  btn.classList.add("selected");

  const rect = btn.getBoundingClientRect();
  const x = e && e.clientX ? e.clientX : rect.left + rect.width / 2;
  const y = e && e.clientY ? e.clientY : rect.top + rect.height / 2;
  if (wasNew) { floatXP(x, y); $("xp").classList.remove("bump"); void $("xp").offsetWidth; $("xp").classList.add("bump"); }

  updateHud();
  emit("game:gain", Object.keys(QUESTIONS[current].a[i].s));

  setTimeout(() => {
    busy = false;
    if (current < QUESTIONS.length - 1) { current++; renderLevel(); }
    else startReveal();

}

async function share() {
  const p = PERSONAS[lastResult.primary];
  const text = `I unlocked ${p.name}! My AI superpower is ${p.superpower}. What's yours?`;
  const url = location.href.split("#")[0];
  try {
    if (navigator.share) { await navigator.share({ title: "What's your AI superpower?", text, url }); return; }

  Sound.init(); Sound.start(); vibrate(20);
  answers.fill(null); current = 0; renderLevel(); show("quiz");
});
$("backBtn").addEventListener("click", () => {
  if (busy || current === 0) return;
  Sound.back(); current--; renderLevel();
});
$("retryBtn").addEventListener("click", () => { Sound.start(); answers.fill(null); current = 0; renderLevel(); show("quiz"); });
$("shareBtn").addEventListener("click", share);

<script type="importmap">

<script type="module">
/* ===== 3D stage (Three.js) =====
   Reads window.GAME and listens to game:* events from the script above.
   If anything here fails, the game keeps working with the 2D fallback. */
const G = window.GAME;
const HKEYS = G.keys, PERS = G.personas;
const TAU = Math.PI * 2, STEP = TAU / 6;
let THREE, RoomEnvironment, RoundedBoxGeometry, mergeVertices, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;

try {
  const A = "three/addons/";
  const m = await Promise.all([
    import("three"),
    import(A + "environments/RoomEnvironment.js"),
    import(A + "geometries/RoundedBoxGeometry.js"),
    import(A + "utils/BufferGeometryUtils.js"),
    import(A + "postprocessing/EffectComposer.js"),
    import(A + "postprocessing/RenderPass.js"),
    import(A + "postprocessing/UnrealBloomPass.js"),
    import(A + "postprocessing/OutputPass.js")
  ]);
  THREE = m[0];
  RoomEnvironment = m[1].RoomEnvironment;
  RoundedBoxGeometry = m[2].RoundedBoxGeometry;
  mergeVertices = m[3].mergeVertices;
  EffectComposer = m[4].EffectComposer;
  RenderPass = m[5].RenderPass;
  UnrealBloomPass = m[6].UnrealBloomPass;
  OutputPass = m[7].OutputPass;
} catch (err) {
  console.error("[3D stage] could not load Three.js", err);
  window.dispatchEvent(new Event("stage:failed"));
}

/* ---------- Helpers: materials, textures, mesh builders ---------- */
let MAT = null;
function initMaterials() {
  MAT = {
    ceramic: new THREE.MeshPhysicalMaterial({ color: 0xd9deea, roughness: 0.34, clearcoat: 1, clearcoatRoughness: 0.1 }),
    visor: new THREE.MeshPhysicalMaterial({ color: 0x04050a, metalness: 0.5, roughness: 0.1, clearcoat: 1, clearcoatRoughness: 0.02 }),
    chrome: new THREE.MeshStandardMaterial({ color: 0xdfe3ee, metalness: 1, roughness: 0.16 }),
    gunmetal: new THREE.MeshStandardMaterial({ color: 0x2a2f45, metalness: 0.9, roughness: 0.32 }),
    gold: new THREE.MeshStandardMaterial({ color: 0xffc46b, metalness: 1, roughness: 0.22 }),
    sil: new THREE.MeshStandardMaterial({ color: 0x090b16, metalness: 1, roughness: 0.3 })
  };
}
const shell = (hex) => new THREE.MeshPhysicalMaterial({ color: hex, metalness: 0.15, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.08 });
const glow = (hex, k = 2.5) => new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k) });
const holo = (hex, opacity = 0.5) => new THREE.MeshBasicMaterial({
  color: new THREE.Color(hex).multiplyScalar(1.6), transparent: true, opacity,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
});
const lineMat = (hex, opacity = 0.9) => new THREE.LineBasicMaterial({
  color: new THREE.Color(hex).multiplyScalar(2), transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
});
const box = (w, h, d, r) => new RoundedBoxGeometry(w, h, d, 4, r);
const sphere = (r, w = 48, h = 32) => new THREE.SphereGeometry(r, w, h);
const FLAT = Math.PI / 2;

/* Adds a mesh. o.glow = emissive part (stays lit, dimmed, as a silhouette);
   o.fx = hologram/effect part (hidden as a silhouette). */
function add(parent, geometry, material, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x, y, z);
  if (o.rx) m.rotation.x = o.rx;
  if (o.ry) m.rotation.y = o.ry;
  if (o.rz) m.rotation.z = o.rz;
  if (o.s) m.scale.set(o.s[0], o.s[1], o.s[2]);
  if (o.glow) m.userData.glow = true;
  if (o.fx) m.userData.fx = true;
  parent.add(m);
  return m;
}
function addLines(parent, geometry, material, rx = 0) {
  const l = new THREE.LineSegments(geometry, material);
  l.rotation.x = rx;
  l.userData.fx = true;
  parent.add(l);
  return l;
}
function rod(parent, a, b, r, material) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 10), material);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  parent.add(m);
  return m;
}
function makeTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const radial = (stops) => (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr;
  g.fillRect(0, 0, w, h);
};

/* Hover emitter under the body plus a faint anti-gravity beam to the floor. */
function hoverBase(h, c, y = 0.44) {
  add(h.body, new THREE.CylinderGeometry(0.15, 0.19, 0.06, 32), MAT.gunmetal, 0, y + 0.03, 0);
  add(h.body, new THREE.TorusGeometry(0.13, 0.018, 12, 48), glow(c, 3), 0, y, 0, { rx: FLAT, glow: true });
  add(h.root, new THREE.ConeGeometry(0.34, y, 32, 1, true), holo(c, 0.1), 0, y / 2, 0, { fx: true }).userData.hoverBeam = true;
}

/* Silhouette = "mystery" look used during the levels and the spin. */
function setSil(h, on) {
  if (h.isSil === on) return;
  h.isSil = on;
  h.root.traverse((o) => {
    if ((!o.isMesh && !o.isLine) || o === h.shadow) return;
    if (o.userData.orig === undefined) o.userData.orig = o.material;
    if (o.userData.fx) { o.visible = !on; return; }
    o.material = on ? (o.userData.glow ? h.silGlow : MAT.sil) : o.userData.orig;
  });
}

/* Idle motion shared by every hero: hover bob, floating hands, blinking, looking around. */
function animateHero(h, t, dt) {
  h.body.position.y = (h.lift || 0) + Math.sin(t * 1.6 + h.phase) * 0.045 * (h.hover || 1) + h.jump;
  h.hands.forEach((hand, i) => {
    hand.position.y = hand.userData.y0 + Math.sin(t * 1.9 + h.phase + i * 1.4) * 0.035;
    hand.rotation.y = Math.sin(t * 0.8 + i) * 0.4;
  });
  const bt = (t + h.phase * 3) % h.blinkEvery;
  const s = bt < 0.16 ? Math.max(0.08, Math.abs(Math.cos((bt / 0.16) * Math.PI))) : 1;
  h.eyes.forEach((e) => { e.scale.y = e.userData.sy * s; });
  if (h.head) h.head.rotation.y = Math.sin(t * 0.6 + h.phase) * 0.18;
  h.update(t, dt);
}

/* ---------- The six heroes (built from primitives, ~1.9 units tall, facing +z) ---------- */
const BUILD = {
  /* Architect: boxy builder bot projecting a blueprint hologram, with gold modules orbiting its head. */
  ARC(h, c) {
    const b = h.body, sh = shell(c);
    add(b, box(0.7, 0.6, 0.48, 0.18), MAT.ceramic, 0, 0.78, 0);
    add(b, box(0.42, 0.3, 0.06, 0.06), sh, 0, 0.82, 0.235);
    add(b, box(0.26, 0.035, 0.02, 0.015), glow("#9ff4ff", 3), 0, 0.88, 0.27, { glow: true });
    ["#36d6c3", "#ffc93d", "#ff5d7a"].forEach((col, i) => add(b, sphere(0.018, 12, 8), glow(col, 3), (i - 1) * 0.07, 0.78, 0.27, { glow: true }));
    hoverBase(h, c);
    add(b, new THREE.CylinderGeometry(0.09, 0.11, 0.12, 24), MAT.chrome, 0, 1.12, 0);
    const head = new THREE.Group(); head.position.y = 1.44; b.add(head); h.head = head;
    add(head, box(0.8, 0.56, 0.6, 0.2), sh);
    add(head, box(0.64, 0.34, 0.08, 0.1), MAT.visor, 0, -0.01, 0.27);
    [-0.13, 0.13].forEach((x) => h.eyes.push(add(head, box(0.09, 0.13, 0.02, 0.035), glow("#9ff4ff", 3.2), x, 0, 0.315, { glow: true })));
    [-1, 1].forEach((s) => add(head, new THREE.CylinderGeometry(0.075, 0.075, 0.06, 24), MAT.chrome, s * 0.42, 0, 0, { rz: FLAT }));
    h.hands = [-1, 1].map((s) => add(b, box(0.18, 0.18, 0.18, 0.06), MAT.ceramic, s * 0.56, 0.74, 0.06));

    const holoCube = new THREE.Group(); holoCube.position.set(0.6, 1.12, 0.18); b.add(holoCube);
    addLines(holoCube, new THREE.EdgesGeometry(new THREE.BoxGeometry(0.3, 0.3, 0.3)), lineMat("#8fd0ff"));
    add(holoCube, new THREE.BoxGeometry(0.3, 0.3, 0.3), holo(c, 0.1), 0, 0, 0, { fx: true });
    add(holoCube, new THREE.BoxGeometry(0.11, 0.11, 0.11), holo("#8fd0ff", 0.55), 0, 0, 0, { fx: true });
    const orbit = new THREE.Group(); orbit.position.y = 1.44; b.add(orbit);
    const mods = [0, 1, 2].map((i) => {
      const m = add(orbit, box(0.09, 0.09, 0.09, 0.02), MAT.gold);
      m.userData.ph = i * (TAU / 3);
      return m;
    });
    h.update = (t) => {
      holoCube.rotation.set(t * 0.7, t * 0.9, 0);
      holoCube.position.y = 1.12 + Math.sin(t * 1.6) * 0.04;
      mods.forEach((m) => {
        const a = t * 1.1 + m.userData.ph;
        m.position.set(Math.cos(a) * 0.62, 0.14 + Math.sin(a * 2) * 0.07, Math.sin(a) * 0.62);
        m.rotation.set(t, t * 1.3, 0);
      });
    };
  },

  /* Pattern Hunter: one big scanning lens, antenna, and a ring of data points orbiting it. */
  DAT(h, c) {
    const b = h.body, sh = shell(c);
    add(b, sphere(0.4), MAT.ceramic, 0, 0.8, 0, { s: [1, 1.08, 0.95] });
    add(b, new THREE.TorusGeometry(0.4, 0.03, 16, 64), sh, 0, 0.8, 0, { rx: FLAT });
    hoverBase(h, c, 0.4);
    const head = new THREE.Group(); head.position.y = 1.42; b.add(head); h.head = head;
    add(head, sphere(0.34), sh);
    add(head, new THREE.TorusGeometry(0.205, 0.035, 16, 64), MAT.chrome, 0, 0, 0.275);
    add(head, new THREE.CylinderGeometry(0.2, 0.2, 0.06, 48), MAT.visor, 0, 0, 0.27, { rx: FLAT });
    const iris = new THREE.Group(); iris.position.z = 0.305; head.add(iris);
    add(iris, new THREE.TorusGeometry(0.1, 0.018, 12, 48), glow(c, 3.2), 0, 0, 0, { glow: true });
    add(iris, new THREE.CircleGeometry(0.045, 32), glow("#e9fffd", 3), 0, 0, 0.002, { glow: true });
    h.eyes.push(iris);
    rod(head, [0.09, 0.26, 0], [0.155, 0.5, 0], 0.012, MAT.chrome);
    const tip = add(head, sphere(0.035, 16, 12), glow("#ffd36b", 3), 0.155, 0.5, 0, { glow: true });
    h.hands = [-1, 1].map((s) => add(b, sphere(0.1, 32, 24), MAT.ceramic, s * 0.56, 0.78, 0.05));

    const ring = new THREE.Group(); ring.position.y = 1.05; ring.rotation.set(0.35, 0, 0.2); b.add(ring);
    const dotG = sphere(0.022, 10, 8), dotM = glow(c, 3);
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU;
      add(ring, dotG, dotM, Math.cos(a) * 0.72, 0, Math.sin(a) * 0.72, { fx: true });
    }
    addLines(ring, new THREE.EdgesGeometry(new THREE.CircleGeometry(0.72, 72)), lineMat(c, 0.25), FLAT);
    h.update = (t) => {
      ring.rotation.y = t * 0.6;
      iris.position.x = Math.sin(t * 1.3) * 0.05;
      tip.visible = Math.sin(t * 5) > -0.3;
    };
  },

  /* Guardian: armored helmet with a visor slit and crest, holding a hexagonal energy shield. */
  GRD(h, c) {
    const b = h.body, sh = shell(c);
    add(b, box(0.76, 0.64, 0.5, 0.2), MAT.ceramic, 0, 0.78, 0);
    [-1, 1].forEach((s) => add(b, sphere(0.17, 32, 24), sh, s * 0.42, 1.0, 0, { s: [1, 0.75, 1.05] }));
    add(b, new THREE.CylinderGeometry(0.09, 0.09, 0.02, 6), glow(c, 3), 0, 0.84, 0.255, { rx: FLAT, glow: true });
    hoverBase(h, c);
    const head = new THREE.Group(); head.position.y = 1.44; b.add(head); h.head = head;
    add(head, sphere(0.33), sh, 0, 0, 0, { s: [1, 1.08, 1] });
    add(head, new THREE.CylinderGeometry(0.338, 0.338, 0.13, 48, 1, true, -Math.PI * 0.32, Math.PI * 0.64), MAT.visor);
    h.eyes.push(add(head, new THREE.CylinderGeometry(0.343, 0.343, 0.03, 48, 1, true, -Math.PI * 0.24, Math.PI * 0.48), glow("#b6ffe0", 3.4), 0, 0, 0, { glow: true }));
    add(head, box(0.05, 0.2, 0.46, 0.022), MAT.chrome, 0, 0.36, -0.02);
    h.hands = [-1, 1].map((s) => add(b, box(0.17, 0.2, 0.17, 0.06), sh, s * 0.58, 0.72, 0.05));

    const shield = new THREE.Group(); shield.position.set(-0.7, 0.92, 0.3); shield.rotation.y = 0.45; b.add(shield);
    const spinner = new THREE.Group(); shield.add(spinner);
    const hexG = new THREE.CylinderGeometry(0.36, 0.36, 0.02, 6);
    add(spinner, hexG, holo(c, 0.16), 0, 0, 0, { rx: FLAT, fx: true });
    addLines(spinner, new THREE.EdgesGeometry(hexG), lineMat(c), FLAT);
    add(spinner, new THREE.TorusGeometry(0.2, 0.008, 4, 6), holo(c, 0.7), 0, 0, 0, { fx: true });
    h.update = (t) => {
      shield.position.y = 0.92 + Math.sin(t * 1.4) * 0.04;
      spinner.rotation.z = t * 0.3;
    };
  },

  /* Creator: a liquid, iridescent shape-shifting body with paint orbs and a floating sculpture. */
  CRT(h, c) {
    const b = h.body;
    const iri = new THREE.MeshPhysicalMaterial({
      color: c, metalness: 0.55, roughness: 0.14, clearcoat: 1, clearcoatRoughness: 0.05,
      iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [120, 520]
    });
    let g = new THREE.IcosahedronGeometry(1, 12);
    g.deleteAttribute("normal"); g.deleteAttribute("uv");
    g = mergeVertices(g);
    g.computeVertexNormals();
    const base = g.attributes.position.array.slice();
    add(b, g, iri, 0, 1.0, 0, { s: [0.5, 0.6, 0.47] });
    add(b, sphere(0.2, 40, 24), MAT.visor, 0, 1.18, 0.4, { s: [1.25, 0.72, 0.5] });
    [-0.09, 0.09].forEach((x) => h.eyes.push(add(b, sphere(0.045, 24, 16), glow("#ffe1f0", 3.2), x, 1.19, 0.49, { s: [1, 1.35, 0.5], glow: true })));
    hoverBase(h, c, 0.38);
    h.hands = [-1, 1].map((s) => add(b, sphere(0.095, 32, 24), iri, s * 0.66, 0.86, 0.06));

    const orbs = ["#36d6ff", "#ffd23d", "#8b5cff", "#3ddc97", "#ff8a3d"].map((col, i) => {
      const m = add(b, sphere(0.06 + (i % 2) * 0.02, 32, 24), new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.15, clearcoat: 1, metalness: 0.1 }));
      m.userData.o = { r: 0.7 + (i % 3) * 0.08, sp: 0.55 + i * 0.17, ph: i * 1.3, y: 0.72 + i * 0.17 };
      return m;
    });
    const knot = add(b, new THREE.TorusKnotGeometry(0.1, 0.03, 128, 16),
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.1, iridescence: 1, iridescenceIOR: 2 }), 0.66, 1.22, 0.12);
    h.update = (t) => {
      const pos = g.attributes.position, arr = pos.array;
      for (let i = 0; i < arr.length; i += 3) {
        const x = base[i], y = base[i + 1], z = base[i + 2];
        const d = 1 + 0.055 * Math.sin(x * 3.1 + t * 1.6) * Math.sin(y * 2.7 + t * 1.2) + 0.035 * Math.sin(z * 3.7 + y * 1.3 + t * 2.1);
        arr[i] = x * d; arr[i + 1] = y * d; arr[i + 2] = z * d;
      }
      pos.needsUpdate = true;
      g.computeVertexNormals();
      orbs.forEach((m) => {
        const o = m.userData.o, a = t * o.sp + o.ph;
        m.position.set(Math.cos(a) * o.r, o.y + Math.sin(a * 1.7) * 0.06, Math.sin(a) * o.r);
      });
      knot.rotation.set(t * 0.8, t * 0.5, 0);
      knot.position.y = 1.22 + Math.sin(t * 1.5) * 0.04;
    };
  },

  /* Catalyst: rocket-bodied bot hovering on a live thruster flame, pumping its fist. */
  FND(h, c) {
    const b = h.body, sh = shell(c);
    h.lift = 0.12; h.hover = 1.8;
    add(b, new THREE.CapsuleGeometry(0.33, 0.36, 12, 32), MAT.ceramic, 0, 0.86, 0);
    add(b, new THREE.CylinderGeometry(0.338, 0.338, 0.12, 48, 1, true), sh, 0, 0.92, 0);
    for (let i = 0; i < 3; i++) {
      const a = Math.PI + (i - 1) * (TAU / 3);
      add(b, box(0.05, 0.32, 0.24, 0.02), sh, Math.sin(a) * 0.33, 0.62, Math.cos(a) * 0.33, { ry: a });
    }
    add(b, new THREE.CylinderGeometry(0.13, 0.17, 0.12, 32), MAT.gunmetal, 0, 0.42, 0);
    const flame = new THREE.Group(); flame.position.y = 0.36; b.add(flame);
    add(flame, new THREE.ConeGeometry(0.12, 0.5, 24, 1, true), holo("#ff7a2e", 0.75), 0, -0.25, 0, { rx: Math.PI, fx: true });
    add(flame, new THREE.ConeGeometry(0.06, 0.3, 24, 1, true), holo("#fff3c4", 0.95), 0, -0.15, 0, { rx: Math.PI, fx: true });
    const head = new THREE.Group(); head.position.y = 1.46; b.add(head); h.head = head;
    add(head, sphere(0.3), sh, 0, 0, 0, { s: [1, 1.05, 1] });
    add(head, new THREE.CylinderGeometry(0.306, 0.306, 0.15, 48, 1, true, -Math.PI * 0.42, Math.PI * 0.84), MAT.visor);
    [-0.08, 0.08].forEach((x) => h.eyes.push(add(head, box(0.07, 0.05, 0.02, 0.018), glow("#fff1d6", 3.4), x, 0, 0.3, { glow: true })));
    add(head, new THREE.ConeGeometry(0.06, 0.14, 24), MAT.chrome, 0, 0.36, 0);
    h.hands = [-1, 1].map((s) => add(b, box(0.16, 0.16, 0.16, 0.06), sh, s * 0.55, 0.8, 0.06));
    const v = new THREE.Vector3();
    h.update = (t, dt) => {
      flame.scale.set(1, 0.85 + Math.random() * 0.3, 1);
      h.hands[1].position.y = 0.8 + Math.max(0, Math.sin(t * 2.2)) * 0.22;
      if (dt > 0 && FX.emit && !h.isSil && h.vis > 0.5 && Math.random() < 0.6) {
        flame.getWorldPosition(v);
        v.y -= 0.3;
        FX.emit(v, "#ffb35c", 1, 0.5, -1.2);
      }
    };
  },

  /* Bridge Builder: friendly headset bot with a holographic globe and a network linking around it. */
  BRG(h, c) {
    const b = h.body, sh = shell(c);
    add(b, sphere(0.42), MAT.ceramic, 0, 0.8, 0, { s: [1.05, 0.98, 0.95] });
    add(b, new THREE.TorusGeometry(0.2, 0.04, 16, 48), sh, 0, 1.17, 0, { rx: FLAT });
    hoverBase(h, c, 0.4);
    const head = new THREE.Group(); head.position.y = 1.47; b.add(head); h.head = head;
    add(head, box(0.84, 0.54, 0.58, 0.24), sh);
    add(head, box(0.66, 0.32, 0.08, 0.13), MAT.visor, 0, 0, 0.26);
    [-0.14, 0.14].forEach((x) => h.eyes.push(add(head, new THREE.TorusGeometry(0.055, 0.016, 10, 24, Math.PI), glow("#fff1c2", 3.4), x, -0.02, 0.305, { glow: true })));
    [-1, 1].forEach((s) => add(head, new THREE.CylinderGeometry(0.1, 0.1, 0.07, 32), MAT.gunmetal, s * 0.44, 0, 0, { rz: FLAT }));
    add(head, new THREE.TorusGeometry(0.44, 0.022, 12, 64, Math.PI), MAT.gunmetal, 0, 0, 0, { s: [1, 0.72, 1] });
    rod(head, [0.44, -0.08, 0.06], [0.16, -0.2, 0.31], 0.012, MAT.chrome);
    add(head, sphere(0.025, 16, 12), glow(c, 3), 0.16, -0.2, 0.31, { glow: true });
    h.hands = [-1, 1].map((s) => add(b, sphere(0.1, 32, 24), sh, s * 0.58, 0.8, 0.05));

    const globe = new THREE.Group(); globe.position.set(-0.66, 1.18, 0.14); b.add(globe);
    add(globe, new THREE.IcosahedronGeometry(0.17, 2), new THREE.MeshBasicMaterial({
      color: new THREE.Color(c).multiplyScalar(2), wireframe: true, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false
    }), 0, 0, 0, { fx: true });
    add(globe, sphere(0.12, 24, 16), holo(c, 0.15), 0, 0, 0, { fx: true });
    const N = 6, nodeG = sphere(0.028, 12, 8), nodeM = glow(c, 3);

      out[h.key] = c2.toDataURL("image/png");
      beams.forEach((o) => { o.visible = true; });
      h.root.visible = false; h.shadow.visible = true;
    }
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    world.visible = true;
    heroes.forEach((h) => { h.root.visible = true; });
    return out;
  }

  /* ---------- Render loop (drops bloom and resolution on slow phones) ---------- */
  let last = 0, perfN = 0, perfT = 0, lowQuality = false;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    step(dt);
    updateCamera(G.mode, dt);
    bloom.strength = 0.55 + S.kick;
    if (useComposer) composer.render(dt); else renderer.render(scene, camera);
    if (!lowQuality && clock > 1.5 && perfN < 90) {
      perfN++; perfT += dt;
      if (perfN === 90 && perfN / perfT < 38) {
        lowQuality = true; useComposer = false;
        renderer.setPixelRatio(1);
        resize();
      }
    }
  }

  // Compile both looks up front so the first silhouette switch doesn't stutter.
  heroes.forEach((h) => setSil(h, true)); renderer.compile(scene, camera);
  heroes.forEach((h) => setSil(h, false)); renderer.compile(scene, camera);
  try { window.HERO_THUMBS = makeThumbs(); } catch (e) { console.warn("[3D stage] thumbnails skipped", e); }
  step(0);
  updateCamera(G.mode, 0);
  composer.render(0);
  window.dispatchEvent(new Event("stage:ready"));
  requestAnimationFrame((t) => { last = t; frame(t); });
}

if (THREE) {
  try { start(); } catch (err) {
    console.error("[3D stage] failed to start", err);
    window.dispatchEvent(new Event("stage:failed"));
  }
}
</script>
</body>
</html>
